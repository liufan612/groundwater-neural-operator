[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwater-neural-operator"
version = "0.1.0"
description = "Head-conditioned neural operators for groundwater flow and solute transport"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy", "scipy", "pandas", "flopy", "PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]
